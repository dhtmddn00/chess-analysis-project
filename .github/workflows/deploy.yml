name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/chess-api
  WORKER_IMAGE: ghcr.io/${{ github.repository }}/chess-worker

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: chess-analysis-api
          file: chess-analysis-api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: chess-analysis-worker
          file: chess-analysis-worker/Dockerfile
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
            ${{ env.WORKER_IMAGE }}:latest

  deploy-api:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest
    needs: build-images
    defaults:
      run:
        working-directory: chess-analysis-api
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >
          flyctl deploy
          --app "${{ secrets.FLY_API_APP }}"
          --remote-only
          --yes

  deploy-worker:
    name: Deploy worker to Fly.io
    runs-on: ubuntu-latest
    needs: build-images
    defaults:
      run:
        working-directory: chess-analysis-worker
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >
          flyctl deploy
          --app "${{ secrets.FLY_WORKER_APP }}"
          --remote-only
          --yes

  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - deploy-api
    defaults:
      run:
        working-directory: chess-analysis-frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chess-analysis-frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build frontend
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  smoke-test:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs:
      - deploy-api
      - deploy-worker
      - deploy-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test API and worker
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
          CHESS_USERNAME: hikaru
          GAME_COUNT: "5"
        run: ./scripts/smoke-test.sh
