app = "chess-analysis-api-prod"
primary_region = "nrt"

[env]
  SERVER_PORT = "8080"
  SPRING_PROFILES_ACTIVE = "prod"
  REDIS_SSL = "true"
  SHORTLINK_BASE_URL = "https://chess-analysis-api-prod.fly.dev/s"

[http_service]
  internal_port = 8080
  force_https = true
  # auto_stop을 끄고 머신을 항상 켜둬 콜드스타트 502를 원천 차단한다.
  # (min_machines_running=1 + auto_stop="stop" 조합이 CI 이미지 배포에서
  #  머신 정지정책까지 반영되지 않아 idle 시 0대로 내려가 502가 발생했음.)
  # Neon/Redis 쿼터는 health check가 DB/Redis를 안 건드리므로 API가 항상
  # 켜져 있어도 idle이면 Neon은 suspend되어 비용 보호는 유지된다.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# liveness 체크는 프로세스 생존만 확인하면 충분하다.
# /api/v1/actuator/health는 매 호출마다 Redis PING + DB 검증을 수행해
# Upstash/Neon 사용량을 잡아먹으므로, 의존성을 건드리지 않는 정적 /api/v1/health를 사용.
# interval 30s→60s로 완화(호출 빈도 절반).
[[http_service.checks]]
  grace_period = "60s"
  interval = "60s"
  method = "GET"
  path = "/api/v1/health"
  port = 8080
  timeout = "10s"
  type = "http"
