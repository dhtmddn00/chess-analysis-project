app            = "chess-analysis-prometheus"
primary_region = "nrt"

# Dockerfile.prometheus가 prod config를 내장
[build]
  dockerfile = "deploy/fly/Dockerfile.prometheus"

# 데이터 영속성 — 볼륨 먼저 생성 필요:
#   fly volumes create prometheus_data --size 3 --region nrt --app chess-analysis-prometheus
[[mounts]]
  source      = "prometheus_data"
  destination = "/prometheus"

# 내부 전용 (공개 포트 없음) — fly proxy로만 접근
# 같은 org 내 Grafana는 chess-analysis-prometheus.internal:9090 으로 직접 접근
[[services]]
  internal_port = 9090
  protocol      = "tcp"
  auto_stop_machines  = false
  auto_start_machines = true

  [[services.tcp_checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "15s"

# 보존 기간 7일 + 3GB 볼륨 크기 제한 (무료 한도 내)
[processes]
  app = "--config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d --storage.tsdb.retention.size=2GB --web.enable-lifecycle"

[vm]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 256
