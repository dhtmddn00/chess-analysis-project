services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chess-postgres
    environment:
      POSTGRES_DB: chess_analysis
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chess_analysis"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: chess-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Spring Boot API Server
  chess-api:
    build:
      context: ./chess-analysis-api
      dockerfile: Dockerfile
    container_name: chess-api
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/chess_analysis
      - SPRING_DATASOURCE_USERNAME=chess_user
      - SPRING_DATASOURCE_PASSWORD=local-dev-only
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - AWS_S3_BUCKET=chess-analysis-reports
      - AWS_REGION=us-east-1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python Analysis Workers
  chess-worker-1:
    build:
      context: ./chess-analysis-worker
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chess_analysis
      - DB_USER=chess_user
      - DB_PASSWORD=local-dev-only
      - STOCKFISH_PATH=/usr/bin/stockfish
      - WORKER_ID=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chess-api:
        condition: service_healthy
    restart: unless-stopped

  chess-worker-2:
    build:
      context: ./chess-analysis-worker
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chess_analysis
      - DB_USER=chess_user
      - DB_PASSWORD=local-dev-only
      - STOCKFISH_PATH=/usr/bin/stockfish
      - WORKER_ID=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chess-api:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Frontend
  chess-frontend:
    build:
      context: ./chess-analysis-frontend
      dockerfile: Dockerfile
    container_name: chess-frontend
    environment:
      - INTERNAL_API_URL=http://chess-api:8080
      - NEXT_PUBLIC_API_URL=
    ports:
      - "3000:3000"
    depends_on:
      chess-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: chess-analysis-network
